version: '3.8'

services:
  # 1. PostgreSQL 16 Database (OLTP + OLAP Kimball Star Schema)
  db:
    image: postgres:16-alpine
    container_name: finsight-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finsight_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsight_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-finsight_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsight_admin} -d ${POSTGRES_DB:-finsight_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finsight-net

  # 2. FastAPI Modular Monolith Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsight-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-finsight_admin}:${POSTGRES_PASSWORD:-finsight_secure_pass_2026}@db:5432/${POSTGRES_DB:-finsight_db}
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-finsight-enterprise-super-secret-dev-key-change-in-production-2026}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
    networks:
      - finsight-net

networks:
  finsight-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
